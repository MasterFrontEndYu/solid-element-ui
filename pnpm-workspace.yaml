packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  solid-js: ^2.0.0-rc.0
  "@solidjs/vite-plugin": 3.0.0-next.28
  "@solidjs/web": 2.0.0-rc.0
  vitest: "^4.1.10"
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: false
